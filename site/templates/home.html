{{define "main"}}<header class="hero">
<h1 class="wordmark"><img src="{{.Root}}assets/parlinfo-wordmark.svg" alt="parlinfo" width="240" height="69"></h1>
<p class="tagline">{{.T.Tagline}}</p>
</header>
<p class="intro">{{.T.Intro}}</p>
<ul class="pillars">
{{- range .T.Pillars}}
<li><strong>{{.Title}}</strong><span>{{.Text}}</span></li>
{{- end}}
</ul>
<section>
<h2>{{.T.Choose}}</h2>
<ul class="cards">
{{- range .Cards}}
<li><a class="card" href="{{.Href}}">
<img src="{{$.Root}}assets/{{.Mark}}" alt="" width="64" height="64">
<span><strong>{{.Name}}</strong><small>{{.Bodies}}</small></span>
</a></li>
{{- end}}
</ul>
</section>
{{template "support" .}}{{end}}
