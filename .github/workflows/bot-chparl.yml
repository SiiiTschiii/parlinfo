name: CH Parl Info Bot

# The Nationalrat's votes, once per language: German (chparl), French
# (chparl-fr) and Italian (chparl-it). Each job is a bot of its own, with its
# own accounts, vote log and state branch, so the three run side by side. They
# run the same steps, written out once under the de job and reused by the
# others, with what differs between them in each job's env. See SETUP.md.

on:
  schedule:
    # Every 15 minutes on weekdays, the only days the Nationalrat sits. The
    # minutes only keep clear of the top of the hour, when GitHub starts
    # scheduled runs latest. Cron has no year, so the session dates live in
    # .github/chparl-sessions.txt and the session job below checks them.
    - cron: "6,21,36,51 * * * 1-5"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Every channel job below has a concurrency group of its own, named for its channel,
# and none is shared with another job or with bot-zhparl.yml.
#
# One run of a channel at a time: every run pushes the vote log to the channel's
# state branch from a worktree branched at fetch time, and the push is not
# forced. If a slow run overlapped the next one, both would post the same votes,
# and the second push would be rejected and lose its record of them. Queue
# rather than cancel: a run that has already posted must still be allowed to
# write down that it did. GitHub keeps one run waiting per group and drops an
# older waiting one, which loses nothing: the newer run does the same work.
#
# Channels do not wait for each other. All of them commit carousel images to
# this repo's gh-pages branch, where two commits at once can conflict; the
# upload retries a conflict (pkg/igapi/hosting.go) and each channel's file
# names carry its key.

jobs:
  # Lets a scheduled run through only on a day inside one of the sessions in
  # .github/chparl-sessions.txt, by the Swiss date, since cron runs in UTC. A
  # manual run always goes ahead. Every channel job needs it.
  session:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      open: ${{ steps.check.outputs.open }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/chparl-sessions.txt
          sparse-checkout-cone-mode: false

      - name: Check session dates
        id: check
        env:
          SESSIONS_FILE: .github/chparl-sessions.txt
        run: |
          # Before the file is read, so a manual run still works when the
          # dates have run out or a line is broken.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Manual run; going ahead whatever the date."
            echo "open=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today="$(TZ=Europe/Zurich date +%F)"
          open=false
          ahead=false
          label=""
          # A real calendar day written as YYYY-MM-DD: GNU date rejects
          # 2027-12-99 and 2027-02-30, and reading it back rejects any other
          # spelling date would accept.
          is_day() { [ "$(date -d "$1" +%F 2>/dev/null)" = "$1" ]; }

          while read -r from to rest; do
            [[ -z "$from" || "$from" == \#* ]] && continue
            # A typo here would silently switch the bot off for a session.
            if ! is_day "$from" || ! is_day "$to" || [[ "$from" > "$to" ]]; then
              echo "::error file=$SESSIONS_FILE::Malformed session line: $from $to $rest"
              exit 1
            fi
            # ISO dates compare correctly as strings.
            [[ ! "$to" < "$today" ]] && ahead=true
            if [[ ! "$today" < "$from" && ! "$today" > "$to" ]]; then
              open=true
              label="$rest"
            fi
          done < "$SESSIONS_FILE"

          if [ "$ahead" != true ]; then
            echo "::error file=$SESSIONS_FILE::No session ends on or after $today. Add the next sessions, or the bot never runs on schedule again."
            exit 1
          fi

          if [ "$open" = true ]; then
            echo "$today is in the session: $label"
          else
            echo "$today is outside every session; skipping this run."
          fi
          echo "open=$open" >> "$GITHUB_OUTPUT"

  de:
    needs: session
    if: needs.session.outputs.open == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bot-chparl
      cancel-in-progress: false
    env:
      # Isolated branch that holds the mutable state log (posted votes).
      # Keeping it off `main` lets this Action update state without tripping
      # the pull request ruleset / branch protection on the primary branch.
      # Its own branch, so no two bots ever push to the same ref. It must
      # exist before the first run; see SETUP.md.
      STATE_BRANCH: state-log-chparl
      # Vote logs live at data/<jurisdiction>/posted_votes_<platform>.json.
      STATE_FILES: "data/nationalrat/posted_votes_*.json"
      # Only this job's channel. main.go walks every channel when this is unset.
      CHANNEL: chparl
      # Each platform skips itself while its credentials are unset, so a
      # platform goes live by setting them; see SETUP.md.
      CHPARL_X_API_KEY: ${{ secrets.CHPARL_X_API_KEY }}
      CHPARL_X_API_SECRET: ${{ secrets.CHPARL_X_API_SECRET }}
      CHPARL_X_ACCESS_TOKEN: ${{ secrets.CHPARL_X_ACCESS_TOKEN }}
      CHPARL_X_ACCESS_SECRET: ${{ secrets.CHPARL_X_ACCESS_SECRET }}
      CHPARL_BLUESKY_HANDLE: ${{ vars.CHPARL_BLUESKY_HANDLE }}
      CHPARL_BLUESKY_PASSWORD: ${{ secrets.CHPARL_BLUESKY_PASSWORD }}
      CHPARL_IG_USER_ID: ${{ secrets.CHPARL_IG_USER_ID }}
      CHPARL_IG_ACCESS_TOKEN: ${{ secrets.CHPARL_IG_ACCESS_TOKEN }}
      # See bot-zhparl.yml: images are hosted on this repo's gh-pages branch, and
      # github.token can write nowhere else.
      CHPARL_IMAGE_HOST_REPO: ${{ github.repository }}
      CHPARL_IMAGE_HOST_TOKEN: ${{ github.token }}
      # Where that branch is served: the Pages site has a custom domain, and
      # GitHub answers the github.io address with a redirect Instagram is not
      # known to follow. A fork without a domain sets the variable to its own
      # https://<owner>.github.io/<repo>.
      CHPARL_IMAGE_HOST_BASE_URL: ${{ vars.IMAGE_HOST_BASE_URL || 'https://parlinfo.ch' }}
      # Same Page token as Instagram, as on the Zürich bot. The Page ID is
      # the switch. Facebook takes its start date from the jurisdiction's
      # JURISDICTION_NATIONALRAT_POST_FROM below, like every platform here.
      CHPARL_FB_PAGE_ID: ${{ vars.CHPARL_FB_PAGE_ID }}
      CHPARL_FB_ACCESS_TOKEN: ${{ secrets.CHPARL_IG_ACCESS_TOKEN }}
      CHPARL_X_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_X_MAX_POSTS_PER_RUN }}
      CHPARL_X_MAX_CHARS: ${{ vars.CHPARL_X_MAX_CHARS }}
      CHPARL_BLUESKY_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_BLUESKY_MAX_POSTS_PER_RUN }}
      CHPARL_IG_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_IG_MAX_POSTS_PER_RUN }}
      # Tagging is on unless this is "false"; see Channel.Tags.
      CHPARL_TAGGING: ${{ vars.CHPARL_TAGGING }}
      CHPARL_FB_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_FB_MAX_POSTS_PER_RUN }}

      # Its own override, so a catch-up can look further back than the Zürich
      # bots without changing what they fetch.
      MAX_VOTES_TO_CHECK: ${{ vars.MAX_VOTES_TO_CHECK_NATIONALRAT || vars.MAX_VOTES_TO_CHECK }}
      MAX_VOTE_AGE_DAYS_NATIONALRAT: ${{ vars.MAX_VOTE_AGE_DAYS_NATIONALRAT }}
      # Nothing posts until this is "true". See bot-zhparl.yml.
      JURISDICTION_NATIONALRAT_ENABLED: ${{ vars.JURISDICTION_NATIONALRAT_ENABLED }}
      # The first sitting date posted, on every platform (YYYY-MM-DD). The
      # vote logs start empty on it, so nothing earlier is ever posted.
      JURISDICTION_NATIONALRAT_POST_FROM: ${{ vars.JURISDICTION_NATIONALRAT_POST_FROM }}
    steps: &steps
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore vote log from state branch
        id: restore
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # '$STATE_BRANCH' holds the only copy of the vote log, so every failure
          # below is fatal: votelog.Load treats a missing log file as an *empty*
          # log with no error, which reads as "nothing was ever posted" and would
          # re-post everything inside MAX_VOTE_AGE_DAYS.
          if ! state_ref="$(git ls-remote --heads origin "$STATE_BRANCH")"; then
            echo "::error::Cannot reach origin to look up '$STATE_BRANCH'."
            exit 1
          fi

          if [ -z "$state_ref" ]; then
            echo "::error::State branch '$STATE_BRANCH' does not exist. It holds the only copy of the vote log; running without it would re-post already-published votes. Recreate it from a known-good log before running again."
            exit 1
          fi

          echo "State branch '$STATE_BRANCH' found; restoring vote logs from it."
          git fetch origin "$STATE_BRANCH"

          if ! git checkout FETCH_HEAD -- "$STATE_FILES"; then
            echo "::error::'$STATE_BRANCH' contains no vote logs matching $STATE_FILES."
            exit 1
          fi
          echo "Restored:"
          find data -name 'posted_votes_*.json' | sort

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"

      - name: Download dependencies
        run: go mod download

      - name: Run bot
        run: go run main.go

      # Runs even when the bot itself fails, so a partial run still records what
      # it posted — but not when the restore failed, since the logs on disk would
      # then be missing or stale rather than the real state.
      - name: Commit updated vote log to state branch
        if: always() && steps.restore.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Update the state log on the isolated STATE_BRANCH using a dedicated
          # worktree, so nothing is ever committed to the protected primary branch.
          # The restore step guarantees the branch exists and is fetched.
          worktree="$(mktemp -d)"
          git worktree add -B "$STATE_BRANCH" "$worktree" "origin/$STATE_BRANCH"

          # --parents preserves data/<jurisdiction>/, without which two
          # jurisdictions' logs would overwrite each other in the state branch
          # and votes would look unposted on the next run.
          mapfile -t state_files < <(find data -name 'posted_votes_*.json' | sort)
          cp --parents "${state_files[@]}" "$worktree/"

          git -C "$worktree" add -- data
          if git -C "$worktree" diff --staged --quiet; then
            echo "No vote log changes to commit."
          else
            git -C "$worktree" commit -m "Update posted votes log [skip ci]"
            git -C "$worktree" push origin "$STATE_BRANCH"
          fi

          git worktree remove --force "$worktree"

  # A language job runs only once its jurisdiction is switched on, so it can
  # ship before the state branch it restores from exists.
  fr:
    needs: session
    if: needs.session.outputs.open == 'true' && vars.JURISDICTION_NATIONALRAT_FR_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bot-chparl-fr
      cancel-in-progress: false
    env:
      CHANNEL: chparl-fr
      STATE_BRANCH: state-log-chparl-fr
      STATE_FILES: "data/nationalrat-fr/posted_votes_*.json"
      CHPARL_FR_X_API_KEY: ${{ secrets.CHPARL_FR_X_API_KEY }}
      CHPARL_FR_X_API_SECRET: ${{ secrets.CHPARL_FR_X_API_SECRET }}
      CHPARL_FR_X_ACCESS_TOKEN: ${{ secrets.CHPARL_FR_X_ACCESS_TOKEN }}
      CHPARL_FR_X_ACCESS_SECRET: ${{ secrets.CHPARL_FR_X_ACCESS_SECRET }}
      CHPARL_FR_BLUESKY_HANDLE: ${{ vars.CHPARL_FR_BLUESKY_HANDLE }}
      CHPARL_FR_BLUESKY_PASSWORD: ${{ secrets.CHPARL_FR_BLUESKY_PASSWORD }}
      CHPARL_FR_IG_USER_ID: ${{ secrets.CHPARL_FR_IG_USER_ID }}
      CHPARL_FR_IG_ACCESS_TOKEN: ${{ secrets.CHPARL_FR_IG_ACCESS_TOKEN }}
      CHPARL_FR_IMAGE_HOST_REPO: ${{ github.repository }}
      CHPARL_FR_IMAGE_HOST_TOKEN: ${{ github.token }}
      CHPARL_FR_IMAGE_HOST_BASE_URL: ${{ vars.IMAGE_HOST_BASE_URL || 'https://parlinfo.ch' }}
      CHPARL_FR_FB_PAGE_ID: ${{ vars.CHPARL_FR_FB_PAGE_ID }}
      CHPARL_FR_FB_ACCESS_TOKEN: ${{ secrets.CHPARL_FR_IG_ACCESS_TOKEN }}
      CHPARL_FR_X_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_FR_X_MAX_POSTS_PER_RUN }}
      CHPARL_FR_X_MAX_CHARS: ${{ vars.CHPARL_FR_X_MAX_CHARS }}
      CHPARL_FR_BLUESKY_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_FR_BLUESKY_MAX_POSTS_PER_RUN }}
      CHPARL_FR_IG_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_FR_IG_MAX_POSTS_PER_RUN }}
      CHPARL_FR_FB_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_FR_FB_MAX_POSTS_PER_RUN }}
      CHPARL_FR_TAGGING: ${{ vars.CHPARL_FR_TAGGING }}
      # Its own override, so a catch-up can look further back than the other
      # bots without changing what they fetch.
      MAX_VOTES_TO_CHECK: ${{ vars.MAX_VOTES_TO_CHECK_NATIONALRAT_FR || vars.MAX_VOTES_TO_CHECK }}
      MAX_VOTE_AGE_DAYS_NATIONALRAT_FR: ${{ vars.MAX_VOTE_AGE_DAYS_NATIONALRAT_FR }}
      JURISDICTION_NATIONALRAT_FR_POST_FROM: ${{ vars.JURISDICTION_NATIONALRAT_FR_POST_FROM }}
      JURISDICTION_NATIONALRAT_FR_ENABLED: ${{ vars.JURISDICTION_NATIONALRAT_FR_ENABLED }}
    steps: *steps

  it:
    needs: session
    if: needs.session.outputs.open == 'true' && vars.JURISDICTION_NATIONALRAT_IT_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bot-chparl-it
      cancel-in-progress: false
    env:
      CHANNEL: chparl-it
      STATE_BRANCH: state-log-chparl-it
      STATE_FILES: "data/nationalrat-it/posted_votes_*.json"
      CHPARL_IT_X_API_KEY: ${{ secrets.CHPARL_IT_X_API_KEY }}
      CHPARL_IT_X_API_SECRET: ${{ secrets.CHPARL_IT_X_API_SECRET }}
      CHPARL_IT_X_ACCESS_TOKEN: ${{ secrets.CHPARL_IT_X_ACCESS_TOKEN }}
      CHPARL_IT_X_ACCESS_SECRET: ${{ secrets.CHPARL_IT_X_ACCESS_SECRET }}
      CHPARL_IT_BLUESKY_HANDLE: ${{ vars.CHPARL_IT_BLUESKY_HANDLE }}
      CHPARL_IT_BLUESKY_PASSWORD: ${{ secrets.CHPARL_IT_BLUESKY_PASSWORD }}
      CHPARL_IT_IG_USER_ID: ${{ secrets.CHPARL_IT_IG_USER_ID }}
      CHPARL_IT_IG_ACCESS_TOKEN: ${{ secrets.CHPARL_IT_IG_ACCESS_TOKEN }}
      CHPARL_IT_IMAGE_HOST_REPO: ${{ github.repository }}
      CHPARL_IT_IMAGE_HOST_TOKEN: ${{ github.token }}
      CHPARL_IT_IMAGE_HOST_BASE_URL: ${{ vars.IMAGE_HOST_BASE_URL || 'https://parlinfo.ch' }}
      CHPARL_IT_FB_PAGE_ID: ${{ vars.CHPARL_IT_FB_PAGE_ID }}
      CHPARL_IT_FB_ACCESS_TOKEN: ${{ secrets.CHPARL_IT_IG_ACCESS_TOKEN }}
      CHPARL_IT_X_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_IT_X_MAX_POSTS_PER_RUN }}
      CHPARL_IT_X_MAX_CHARS: ${{ vars.CHPARL_IT_X_MAX_CHARS }}
      CHPARL_IT_BLUESKY_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_IT_BLUESKY_MAX_POSTS_PER_RUN }}
      CHPARL_IT_IG_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_IT_IG_MAX_POSTS_PER_RUN }}
      CHPARL_IT_FB_MAX_POSTS_PER_RUN: ${{ vars.CHPARL_IT_FB_MAX_POSTS_PER_RUN }}
      CHPARL_IT_TAGGING: ${{ vars.CHPARL_IT_TAGGING }}
      # Its own override, so a catch-up can look further back than the other
      # bots without changing what they fetch.
      MAX_VOTES_TO_CHECK: ${{ vars.MAX_VOTES_TO_CHECK_NATIONALRAT_IT || vars.MAX_VOTES_TO_CHECK }}
      MAX_VOTE_AGE_DAYS_NATIONALRAT_IT: ${{ vars.MAX_VOTE_AGE_DAYS_NATIONALRAT_IT }}
      JURISDICTION_NATIONALRAT_IT_POST_FROM: ${{ vars.JURISDICTION_NATIONALRAT_IT_POST_FROM }}
      JURISDICTION_NATIONALRAT_IT_ENABLED: ${{ vars.JURISDICTION_NATIONALRAT_IT_ENABLED }}
    steps: *steps
