# Social media handles for members of the Ständerat.
#
# The 46 names are seeded from the parliament's own roster and refreshed with:
#
#     go run ./cmd/update_contacts -jurisdiction staenderat
#
# Nothing posts the Ständerat yet — parlament.ch serves the Nationalrat's votes
# only — so no handle here is tagged. The file is kept so the work is done when
# that changes, and for outreach in the meantime.
#
# The first candidates came from Wikidata, matched on the member's parlament.ch
# ID (P1307) rather than on the name. That makes them better leads than a name
# search, and still not accounts: Wikidata is edited by anyone and lags behind
# renamed and abandoned handles. Entries carrying `verified: false` are tagged
# by nothing. To confirm one: open it, check it is the person named above it,
# then set `verified: true` and delete the `confidence` line. `confidence` is
# an ordering aid, never evidence.
#
# Getting one wrong puts a real person's handle next to a vote they did not cast,
# which is the failure this whole mapping exists to prevent. A member with no
# verified handle is fine: the post names them without tagging them.
#
# Work through them with the search links:
#
#     go run ./cmd/generate_search_urls -jurisdiction staenderat

